```yaml
name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. 设置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.1

    # =========================================================
    # 4. 检查签名 Secret
    # =========================================================
    - name: 4. 检查签名配置
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -e

        if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "❌ ANDROID_KEYSTORE_BASE64 未设置"
          exit 1
        fi

        if [ -z "$KEYSTORE_PASSWORD" ]; then
          echo "❌ KEYSTORE_PASSWORD 未设置"
          exit 1
        fi

        if [ -z "$KEY_ALIAS" ]; then
          echo "❌ KEY_ALIAS 未设置"
          exit 1
        fi

        if [ -z "$KEY_PASSWORD" ]; then
          echo "❌ KEY_PASSWORD 未设置"
          exit 1
        fi

        echo "✅ 签名 Secret 均已配置"

    # =========================================================
    # 5. 还原 JKS
    # =========================================================
    - name: 5. 还原签名证书
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        set -e

        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

        echo "检查 keystore 文件..."

        if [ ! -s app/release-key.jks ]; then
          echo "❌ release-key.jks 文件为空"
          exit 1
        fi

        echo "文件大小："
        ls -lh app/release-key.jks

        echo "检查 JKS 是否可以读取..."

        keytool -list \
          -keystore app/release-key.jks \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          >/tmp/keystore-check.txt

        echo "✅ JKS 证书读取成功"
        cat /tmp/keystore-check.txt

    # =========================================================
    # 6. 构建 Release
    # =========================================================
    - name: 6. 打包 Release APK
      env:
        KEYSTORE_PATH: release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        gradle clean assembleRelease --stacktrace

    # =========================================================
    # 7. 上传 APK
    # =========================================================
    - name: 7. 上传 APK 安装包
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
```
